            display: inline-block;
        }
        .shake { animation: shakeAnim 0.5s infinite; }
        .flip { animation: flipAnim 0.6s ease-in-out infinite; }

        @keyframes shakeAnim {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes flipAnim {
            0% { transform: rotateX(0deg) translateY(0); }
            50% { transform: rotateX(180deg) translateY(-20px); }
            100% { transform: rotateX(360deg) translateY(0); }

<script>
    // Web Audio API 合成擬真打擊聲
    function playSound(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'jiao') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.8, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                osc.start();
                osc.stop(ctx.currentTime + 0.2);
            }
        } catch(e) {}
    }

    // 分頁切換
    function switchTab(mode) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (mode === 'ask') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('ask-tab').classList.add('active');
        } else if (mode === 'draw') {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('draw-tab').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[2].classList.add('active');
            document.getElementById('history-tab').classList.add('active');
            loadHistory();
        }
    }

    // 擲筊邏輯
    function askTemple() {
        const q = document.getElementById('ask-question').value.trim();
        const animBox = document.getElementById('ask-anim');
        const resBox = document.getElementById('ask-result');

        if (!q) {
            resBox.innerHTML = '<div class="result-text" style="color:#ff9999;">⚠️ 請先誠心輸入您的問題！</div>';
            return;
        }

        resBox.innerHTML = '';
        animBox.innerHTML = '<div class="anim-box flip">🌙</div>';
        playSound('jiao');

        setTimeout(() => {
            animBox.innerHTML = '';
            const responses = [
                "【聖杯】神明指示：聖筊！所求之事大吉可行！",

                "【陰杯】神明指示：蓋杯！時機未到或不可行，請三思。"
            ];
            const resultText = responses[Math.floor(Math.random() * responses.length)];
            
            resBox.innerHTML = `
                <div class="result-text">${resultText}</div>
                <button class="share-btn" onclick="copyResult('${q}', '${resultText}')">📋 複製結果給朋友</button>
            `;
            saveHistory('擲筊問事', q, resultText);
        }, 1200);
    }

    // 求籤邏輯
    function drawSign() {
        const q = document.getElementById('draw-question').value.trim();
        const animBox = document.getElementById('draw-anim');
        const resBox = document.getElementById('draw-result');

        if (!q) {
            resBox.innerHTML = '<div style="color:#ff9999; font-weight:bold;">⚠️ 請先誠心輸入您的問題！</div>';
            return;
        }

        resBox.innerHTML = '';
        animBox.innerHTML = '<div class="anim-box shake">🎋</div>';
        playSound('stick');

        setTimeout(() => {
            animBox.innerHTML = '';
            const poem = poems[Math.floor(Math.random() * poems.length)];
            const fullText = `${poem.num} ${poem.status}\n${poem.lines}\n${poem.explain}`;

            resBox.innerHTML = `
                <div class="poem-card">
                    <div class="poem-title">${poem.num}</div>
                    <div class="poem-status">${poem.status}</div>
                    <div class="poem-content">${poem.lines}</div>
                    <div class="poem-explain">💡 <b>聖意解析：</b><br>${poem.explain}</div>
                </div>
                <button class="share-btn" onclick="copyResult('${q}', '${poem.num} ${poem.status} - ${poem.explain}')">📋 複製籤詩結果</button>
            `;
            saveHistory('搖籤求籤', q, `${poem.num} ${poem.status}`);
        }, 1500);
    }

    // 複製結果功能
    function copyResult(q, ans) {
        const text = `【聖明宮線上靈驗問事亭】\n我的問題：${q}\n神明指示：${ans}`;
        navigator.clipboard.writeText(text).then(() => {
            alert('已成功複製到剪貼簿！可直接貼給朋友分享。');
        }).catch(() => {
            alert('複製失敗，請手動選取文字複製。');
        });
    }

    // 歷史紀錄儲存與讀取 (localStorage)
    function saveHistory(type, q, res) {
        let history = JSON.parse(localStorage.getItem('temple_history') || '[]');
        const time = new Date().toLocaleString('zh-TW', { hour12: false });
        history.unshift({ type, q, res, time });
        if (history.length > 20) history.pop(); // 最多存 20 條
        localStorage.setItem('temple_history', JSON.stringify(history));
    }

    function loadHistory() {
        const listDiv = document.getElementById('history-list');
        let history = JSON.parse(localStorage.getItem('temple_history') || '[]');
        if (history.length === 0) {
            listDiv.innerHTML = '<div style="color:#888; text-align:center; padding:20px;">尚無紀錄</div>';
            return;
        }
        listDiv.innerHTML = history.map(h => `
            <div class="history-item">
                <div class="history-time">[${h.time}] ${h.type}</div>
                <div><b>問：</b>${h.q}</div>
                <div><b>答：</b>${h.res}</div>
            </div>
        `).join('');
    }

    function clearHistory() {
        if (confirm('確定要清除所有歷史紀錄嗎？')) {
            localStorage.removeItem('temple_history');
            loadHistory();
        }
    }
